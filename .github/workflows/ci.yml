name: Campus Care CI

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]

jobs:
  backend-checks:
    name: Backend Lint, Test & Migration Validation
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: campus_care_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d campus_care_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Lint with Ruff
        run: ruff check backend/ --output-format=github

      - name: Check Python formatting
        run: ruff format backend/ --check

      - name: Check Alembic Single Head (FR-DATA-13)
        run: |
          cd backend
          python -m alembic heads

      - name: Run Schema Drift Detection (FR-DATA-12)
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/campus_care_test
        run: |
          cd backend
          python -m alembic upgrade head
          python -m alembic check

      - name: Run Backend Tests
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/campus_care_test
          ENVIRONMENT: test
          SECRET_KEY: test-secret-key-for-ci
        run: |
          cd backend
          pytest tests/ -v

  frontend-checks:
    name: Frontend Lint & Tests (FR-PLAT-19)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.19.x"
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: |
          cd frontend
          flutter pub get

      - name: Verify formatting and analysis
        run: |
          cd frontend
          flutter analyze
