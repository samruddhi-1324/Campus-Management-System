version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: campus_care_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: campus_care
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: campus_care_redis
    ports:
      - "6379:6379"

volumes:
  pgdata:
